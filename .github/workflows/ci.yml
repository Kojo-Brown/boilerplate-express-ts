name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Every gate runs on each Node major in `engines.node` and treats warnings as
# failures:
#   - `pnpm install --strict-peer-dependencies` turns an unmet peer range from a
#     log warning into a non-zero exit.
#   - `pnpm lint` passes `--max-warnings=0`, so a rule set to "warn" fails the
#     job instead of scrolling past in the log.
#   - `NODE_OPTIONS: --throw-deprecation` promotes Node runtime deprecation
#     warnings to thrown errors, so a deprecated API — ours or a dependency's —
#     surfaces on the oldest and the newest supported runtime rather than at the
#     point where that API is finally removed.
# `--pending-deprecation` is deliberately not set: it flags APIs that are not
# deprecated yet, which would fail the build on advisory notices.

jobs:
  lint:
    name: Lint (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Lint
        run: pnpm lint
        env:
          NODE_OPTIONS: --throw-deprecation

  typecheck:
    name: Typecheck (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Typecheck
        run: pnpm typecheck
        env:
          NODE_OPTIONS: --throw-deprecation

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: boilerplate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # The stream consumer's integration suite talks to a real server rather
      # than to a fake, because what it asserts is Redis's behaviour: that
      # XCLAIM refuses an entry below the idle floor, that a pending reference
      # to a trimmed entry is dropped, that XPENDING reports the delivery count
      # the poison ceiling is read from. A fake asserting those would only be
      # asserting what its author believed.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      # Set here and nowhere else: the suite skips when it is absent, so that a
      # contributor without Redis can still run `pnpm test`. `redis.guard.test.ts`
      # is what stops that convenience from turning into a suite that silently
      # never runs — it fails the build if CI is set and this is not.
      REDIS_TEST_URL: redis://localhost:6379
      PORT: "4000"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/boilerplate_test
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3000
      # Names the key generated in the step below. The migrate step boots the
      # config module, and the config module refuses to start without a usable
      # key ring — which is the point of it being required, so CI has to hold
      # one like any other deployment.
      FIELD_ENCRYPTION_ACTIVE_KEY_ID: ci-1
      # Same story for the webhook signing ring, and the same reason it is set
      # here rather than left to `jest.setup.ts`: the migrate step below boots the
      # config module outside Jest, so it needs a ring like any other deployment.
      WEBHOOK_SIGNING_ACTIVE_KEY_ID: ci-1

    steps:
      - uses: actions/checkout@v4

      - name: Generate ephemeral CI secrets
        run: |
          printf 'JWT_ACCESS_SECRET=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          printf 'JWT_REFRESH_SECRET=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          printf 'SESSION_SECRET=%s\n' "$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          printf 'FIELD_ENCRYPTION_KEYS=ci-1:%s\n' "$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          printf 'WEBHOOK_SIGNING_SECRETS=ci-1:%s\n' "$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Run migrations
        run: pnpm migrate
        env:
          NODE_OPTIONS: --throw-deprecation

      - name: Run tests
        run: pnpm test --passWithNoTests
        env:
          NODE_OPTIONS: --throw-deprecation

  build:
    name: Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Build TypeScript
        run: pnpm build
        env:
          NODE_OPTIONS: --throw-deprecation

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-node-${{ matrix.node-version }}
          path: dist/
          retention-days: 1

  integration:
    name: Postgres integration (Testcontainers)
    runs-on: ubuntu-latest
    # After the unit suite for the reason the mutation job is: this run starts a
    # container and migrates a database before it asserts anything, so on a red
    # unit suite it can only report the same failure later and at more cost.
    needs: [test]
    # The suite itself is seconds; the bound is for a container pull that hangs
    # rather than fails. `jest.integration.config.ts` already caps each test.
    timeout-minutes: 15

    # One Node major, deliberately. What these suites measure is PostgreSQL's
    # behaviour and the SQL this codebase sends it — `deadlock_timeout` against
    # `lock_timeout`, `SKIP LOCKED`, the two advisory lock spaces, whether every
    # migration's `down` is honest. None of that is a property of the runtime,
    # and the `pg` driver is already exercised on both majors by the `test` job.

    # No `services:` block. The server is started by `globalSetup` through
    # Testcontainers, which is the point of the suite: the same command runs it
    # here and on a developer's machine, against the same pinned image, with the
    # version recorded next to the assertions that depend on it. The runner
    # provides the Docker socket and nothing else.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      # `DATABASE_URL` is supplied by `globalSetup` from the container it
      # started, and the rest of the environment comes from `jest.setup.ts`, so
      # unlike the `test` job this one needs no secrets generated for it: it
      # never boots the config module outside Jest.
      - name: Postgres integration tests
        run: pnpm test:integration
        env:
          NODE_OPTIONS: --throw-deprecation

  mutation:
    name: Mutation testing
    runs-on: ubuntu-latest
    # After the unit suite, not beside it: Stryker's first act is to run the
    # tests unmutated, so on a red suite this job can only report the same
    # failure eight minutes later and at four times the runner time.
    needs: [test]
    # The run is bounded (about 1000 mutants, ~8 minutes on a 4-core runner) and
    # a mutant that hangs is already handled by `timeoutMS` in the Stryker
    # config. This is the backstop for the run itself wedging.
    timeout-minutes: 25

    # One Node major, deliberately. Mutation score is a property of the test
    # suite's assertions, not of the runtime: a mutant that survives on 22
    # survives on 24. Running both would double the most expensive job in this
    # workflow to re-measure the same number.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      # No Postgres and no Redis service: the scope in `mutation-scope.json` is
      # modules whose every dependency is a parameter, and the suites measured
      # against them are their own unit suites. A scope entry that needed a
      # database would be an entry that breaks its own admission rule.
      - name: Mutation testing
        run: pnpm test:mutation
        env:
          NODE_OPTIONS: --throw-deprecation

      # Uploaded on failure as well — especially on failure. The score alone
      # does not say which assertion went missing; the report names every
      # survivor with its diff and the tests that ran against it.
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 7

  docker:
    name: Docker Push
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build, integration, mutation]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
