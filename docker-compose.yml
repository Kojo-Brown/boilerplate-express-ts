version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-boilerplate}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-boilerplate}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # `appendonly yes` because the streams here carry events that have been
    # committed to Postgres and removed from the outbox: a restart that loses
    # the last second of writes loses them for good. The default RDB snapshot
    # would do exactly that.
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-boilerplate}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      # Required, and required here for the reason it is required in the schema: a
      # compiled-in fallback would be a secret every deployment of this
      # boilerplate shares. `:?` so compose refuses to start rather than handing
      # the container an empty string the config module then rejects one layer
      # further in.
      WEBHOOK_SIGNING_SECRETS: ${WEBHOOK_SIGNING_SECRETS:?WEBHOOK_SIGNING_SECRETS is required, as id:base64 pairs - see .env.example}
      WEBHOOK_SIGNING_ACTIVE_KEY_ID: ${WEBHOOK_SIGNING_ACTIVE_KEY_ID:-k1}
      WEBHOOK_TIMESTAMP_TOLERANCE_SECONDS: ${WEBHOOK_TIMESTAMP_TOLERANCE_SECONDS:-300}
      WEBHOOK_REPLAY_CACHE_MAX_ENTRIES: ${WEBHOOK_REPLAY_CACHE_MAX_ENTRIES:-100000}
      # Optional — leave empty to disable OAuth / S3 locally
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:4000/v1/auth/oauth/google/callback}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PRESIGNED_EXPIRES_IN: ${S3_PRESIGNED_EXPIRES_IN:-3600}
      # Left empty by default so the API boots without Redis. Set it — and set
      # OUTBOX_DISPATCH_TARGET=redis-stream — to route outbox deliveries at the
      # stream instead of at this replica's in-process bus.
      REDIS_URL: ${REDIS_URL:-}
      OUTBOX_DISPATCH_TARGET: ${OUTBOX_DISPATCH_TARGET:-bus}
      # Nothing polls `/v1/health/ready` to decide routing in a compose file, so the
      # drain window has nobody to inform and is off by default here. Under an
      # orchestrator it is the phase that must not be skipped — see
      # docs/graceful-shutdown.md.
      SHUTDOWN_DRAIN_DELAY_MS: ${SHUTDOWN_DRAIN_DELAY_MS:-0}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-25000}
      # On by default in the schema; restated here because the `prometheus`
      # service below scrapes it, and a stack whose scrape target is off by
      # configuration is a target that reads as down.
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      # Off by default. Turning it on also needs tracing on — `env.ts` refuses
      # the combination otherwise — and switches the exposition to OpenMetrics.
      METRICS_EXEMPLARS: ${METRICS_EXEMPLARS:-false}
    # Docker's default is 10 seconds, which is *below* the shutdown budget above:
    # the process would be drained, mid-sequence, by a `SIGKILL` arriving before
    # its own deadline — the exact failure the budget exists to stay ahead of.
    # The 5s margin is the room the sequence needs to report what it closed.
    stop_grace_period: 30s
    ports:
      - '4000:4000'
    healthcheck:
      # Readiness here, unlike the Dockerfile's own HEALTHCHECK, and the two
      # differ on purpose. Compose reports this state to `depends_on:
      # service_healthy`, so what a dependent service is waiting to hear is "can
      # this serve a request", which includes reaching Postgres. Docker's
      # built-in check restarts the container instead, which is liveness, and
      # `/ready` there would restart the API every time Postgres hiccuped.
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/v1/health/ready || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Prometheus and Grafana are behind a profile, so `docker compose up` is
  # unchanged: they start only for `docker compose --profile observability up`.
  # That is deliberate — the API's own metrics endpoint needs neither of them,
  # and a developer running the API should not be made to run a monitoring stack
  # to do it. What the profile buys is the loop that makes the checked-in
  # dashboard verifiable rather than merely plausible.
  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: ['observability']
    restart: unless-stopped
    depends_on:
      - api
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      # Two weeks, because the volume is a developer's disk. Production
      # retention is a decision for whatever runs Prometheus there.
      - '--storage.tsdb.retention.time=14d'
      # Exemplars are stored only when this is on: without it the trace ids the
      # API attaches with METRICS_EXEMPLARS=true are parsed and dropped, and the
      # latency panels come up with no dots and no explanation.
      - '--enable-feature=exemplar-storage'
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:13.0.9
    profiles: ['observability']
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      # Required rather than defaulted, matching how every other credential in
      # this file is handled: a compose stack that comes up with a password
      # checked into a repository is one somebody eventually exposes.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      # Opens the dashboard on the URL below without a login. Local only — it is
      # scoped to `Viewer`, and the whole stack is behind a compose profile on a
      # developer's machine.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - '${GRAFANA_PORT:-3001}:3000'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # The dashboard directory the file provider in
      # `grafana/provisioning/dashboards/dashboards.yml` reads.
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
